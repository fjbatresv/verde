name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'VERDE.md'
      - 'CHANGELOG.md'
      - 'examples/**'
      - 'templates/repo/docs/guides/**'
      - 'guias/**'
      - 'i18n/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'VERDE.md'
      - 'CHANGELOG.md'
      - 'examples/**'
      - 'templates/repo/docs/guides/**'
      - 'guias/**'
      - 'i18n/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
