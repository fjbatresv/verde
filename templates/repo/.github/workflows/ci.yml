name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Prepara tu stack aquí (por ejemplo actions/setup-node + npm ci).
      - name: Gate
        run: make gate
      - name: Gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: tmp/gate.log
          if-no-files-found: ignore
